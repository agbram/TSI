<!-- 10. Crie um formulário com um <input> e um botão “Adicionar Item”. Ao digitar um texto
e clicar no botão, adicione o texto como um novo <li> em uma lista <ul>. Faça com
que cada item adicionado também possa ser removido ao clicar nele. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Formulário</h1>

    <form id="forms">
        <input type="text" placeholder="Digite" id="itemInput">
        <button type="submit" id="botao">Adicionar Item</button>
    </form>

    <ul id="listaItens"></ul>

    <script>
        const input = document.getElementById("itemInput");
        const listaItens = document.getElementById("listaItens");
        const botao = document.getElementById("botao");
                
        botao.onclick = function(event){
            event.preventDefault();
            
           const li = document.createElement("li");

            li.textContent = input.value;

            listaItens.appendChild(li);

            input.value = "";

            li.onclick = function(){
                li.remove();
        };
        };      
    </script>
</body>
</html>
