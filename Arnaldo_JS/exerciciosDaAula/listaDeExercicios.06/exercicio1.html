<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Data Atual</title>
</head>
<body>
  <h2>Data Atual:</h2>
  <p id="dataAtual"></p>

  <script>
    // Cria um objeto com a data atual
    const hoje = new Date();

    // Formata automaticamente para o padrão brasileiro (dd/mm/aaaa)
    const dataBrasil = hoje.toLocaleDateString("pt-BR", {
      timeZone: "America/Sao_Paulo"
    });

    // Exibe na tela
    document.getElementById("dataAtual").textContent = dataBrasil;
  </script>
</body>
</html>
